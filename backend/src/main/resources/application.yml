spring:
  application:
    name: digital-marketplace-backend

  # Development default: in-memory H2 database so the application boots and
  # runs without requiring a live PostgreSQL instance (Docker/PostgreSQL-free).
  # Override at deploy time via DATABASE_URL / DB_USERNAME / DB_PASSWORD
  # environment variables to point at PostgreSQL.
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:digitalmarketplace;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: ${JPA_DIALECT:org.hibernate.dialect.H2Dialect}

server:
  port: ${PORT:8080}

# Placeholders for environment-specific / sensitive values.
# Real values must be provided via environment variables at deploy time.

app:
  jwt:
    # Production must set JWT_SECRET (>= 32 bytes for HS256). The fallback below is
    # a local-development-only secret so the app boots with spring-boot:run.
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-in-production-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
