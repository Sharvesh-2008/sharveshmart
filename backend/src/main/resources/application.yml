spring:
  application:
    name: sharvesh-mart-backend

  # Default datasource: PostgreSQL (used for both local development and production).
  # The database "sharveshmart" must already exist; schema is managed by
  # Hibernate (ddl-auto: update). Override via DATABASE_URL / DATABASE_DRIVER /
  # DB_USERNAME / DB_PASSWORD / JPA_DIALECT (e.g. set these in your environment
  # or in application.yml for production).
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.4.7:5432/sharveshmart}
    driver-class-name: ${DATABASE_DRIVER:org.postgresql.Driver}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: ${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

server:
  port: ${PORT:8080}

# Placeholders for environment-specific / sensitive values.
# Real values must be provided via environment variables at deploy time.

app:
  jwt:
    # Production must set JWT_SECRET (>= 32 bytes for HS256). The fallback below is
    # a local-development-only secret so the app boots with spring-boot:run.
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-in-production-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  demo-data:
    # Development-only demo data (DemoDataInitializer). The initializer refuses to
    # run on PostgreSQL and is idempotent. Disabled in tests via src/test/resources.
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
